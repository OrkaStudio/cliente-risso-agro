<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <!-- PWA: ícono e integración de "Agregar a inicio" en iOS (el manifest lo
         inyecta vite-plugin-pwa, pero apple-touch-icon y theme-color no). -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#178a55" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Risso Agro" />
    <title>Risso Agro</title>
    <!-- Antes de que baje el JavaScript la página ya tiene sus colores: sin
         esto, al recargar se veía un blanco y después la escena de golpe.
         En login/registro/onboarding se pinta el verde de la escena (a la
         izquierda en escritorio, de fondo en el teléfono); en la app, la
         porcelana. main.tsx saca la clase apenas React dibuja. -->
    <style>
      html.pre-auth body { background: #182c1e !important; }
      @media (min-width: 1024px) {
        html.pre-auth body {
          background: linear-gradient(to right, #16281c 0, #1d3524 53.49%, #eef0eb 53.49%) !important;
        }
      }
    </style>
    <script>
      if (/^\/(login|registro|recuperar|restablecer|onboarding)/.test(location.pathname))
        document.documentElement.classList.add('pre-auth')
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
