<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <!-- PWA: ícono e integración de "Agregar a inicio" en iOS (el manifest lo
         inyecta vite-plugin-pwa, pero apple-touch-icon y theme-color no). -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#fff8ec" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Troppero" />
    <title>Troppero</title>
    <!-- La vista previa al mandar el link por WhatsApp o redes (26/11). Es la misma
         para todas las direcciones: WhatsApp no corre JavaScript, lee sólo esto.
         La imagen sale de scripts/og (node scripts/og/og.mjs). -->
    <meta name="description" content="Tu campo, donde estés: la hacienda, los potreros y la plata, con lo que tu gente manda por WhatsApp. Entrás con un código por WhatsApp." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Troppero" />
    <meta property="og:locale" content="es_AR" />
    <meta property="og:url" content="https://app.troppero.com" />
    <meta property="og:title" content="Troppero · Tu campo, donde estés" />
    <meta property="og:description" content="Entrás con tu celular y un código por WhatsApp. Sin contraseña." />
    <meta property="og:image" content="https://app.troppero.com/troppero-compartir.jpg?v=1" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Troppero: tu campo, donde estés. El mapa del campo y un mensaje del encargado por WhatsApp." />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Antes de que baje el JavaScript la página ya tiene sus colores: sin
         esto, al recargar se veía un blanco y después la escena de golpe.
         En login/registro/onboarding se pinta el verde de la escena (a la
         izquierda en escritorio, de fondo en el teléfono); en la app, la
         porcelana. main.tsx saca la clase apenas React dibuja. -->
    <style>
      html.pre-auth body { background: #182c1e !important; }
      @media (min-width: 1024px) {
        html.pre-auth body {
          background: linear-gradient(to right, #16281c 0, #1d3524 53.49%, #eef0eb 53.49%) !important;
        }
      }
    </style>
    <script>
      if (/^\/(login|registro|recuperar|restablecer|onboarding)/.test(location.pathname))
        document.documentElement.classList.add('pre-auth')
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
